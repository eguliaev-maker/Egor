<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Book a Meeting</title>
<style>
  :root {
    --bg: #f5f7fa;
    --card: #ffffff;
    --text: #1a2233;
    --muted: #5b6577;
    --border: #e3e7ee;
    --accent: #1f6feb;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0f141c; --card: #171d27; --text: #e6eaf0; --muted: #9aa4b5; --border: #263040; --accent: #4c8dff;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0f141c; --card: #171d27; --text: #e6eaf0; --muted: #9aa4b5; --border: #263040; --accent: #4c8dff;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex;
    flex-direction: column;
  }
  header, footer {
    padding: 20px 16px;
    text-align: center;
    color: var(--muted);
    font-size: 14px;
  }
  header strong { color: var(--text); font-size: 18px; letter-spacing: .2px; }
  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px 48px;
  }
  .card {
    width: 100%;
    max-width: 820px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(16, 24, 40, .08);
    overflow: hidden;
  }
  .card-head {
    padding: 28px 28px 16px;
    text-align: center;
  }
  .card-head h1 { margin: 0 0 8px; font-size: 28px; }
  .card-head p { margin: 0; color: var(--muted); line-height: 1.5; }
  .accent-bar { height: 4px; background: var(--accent); }
  .embed { padding: 8px 12px 16px; }
  .embed iframe { display: block; width: 100%; background: #fff; border-radius: 8px; }
</style>
</head>
<body>
  <header><strong>Cloudaware</strong></header>

  <main>
    <section class="card">
      <div class="accent-bar"></div>
      <div class="card-head">
        <h1>Book a meeting</h1>
        <p>Pick a time that works for you. You'll get a calendar invite with the meeting link right away.</p>
      </div>
      <div class="embed">
        <!-- Google Calendar Appointment Scheduling begin -->
        <iframe src="https://calendar.google.com/calendar/appointments/schedules/AcZssZ2oVoe-WIqScK0QKvCTzQBGMWzuL946SSgDNyjAjldoAIgfSKoCbfgLTYMtAyqoZ4G2lGA05kPL?gv=true" style="border: 0" width="100%" height="600" frameborder="0"></iframe>
        <!-- end Google Calendar Appointment Scheduling -->
      </div>
    </section>
  </main>

  <footer>© Cloudaware</footer>
</body>
</html>
